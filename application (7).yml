server:
  port: ${PORT:8081}
spring:
  application:
    name: booking-service
  profiles:
    default: demo
  datasource:
    url: jdbc:h2:mem:booking;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 200
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
hotel:
  client:
    base-url: ${HOTEL_SERVICE_URL:http://hotel-service}
    discovery-enabled: ${HOTEL_DISCOVERY_ENABLED:true}
    connect-timeout-ms: 800
    read-timeout-ms: 1500
    attempts: 3
    initial-backoff-ms: 100
booking:
  recovery:
    enabled: true
    interval-ms: 5000
    pending-ttl-ms: 60000
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: ecs
